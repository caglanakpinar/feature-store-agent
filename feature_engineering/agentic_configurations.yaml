# An agentic pipeline for a data scientist, benchmarked end to end on a real problem.
#
# The problem: predict which subscription customers churn next quarter — binary classification, on the
# dataset `dataset.py` generates. Every tool below is a real function in `benchmarks/tools.py` that reads
# that data and returns what it measured, so what the agents claim can be checked against what was
# actually computed.
#
#   python benchmarks/dataset.py          # write the dataset
#   python benchmarks/run_benchmark.py    # build the workflow, render its prompts, run the tool chain
#   python benchmarks/run_benchmark.py --live   # ...and call the models (needs GEMINI / CLAUDE set)

# No `temperature:` on any of these on purpose. Claude Opus 5 and Opus 4.8/4.7 reject the parameter
# outright, and Sonnet 5 accepts only its own default — so a temperature here is a 400, not a tuning
# knob. Leave it unset and the request goes out without it. Models that still take one (Sonnet 4.6,
# Opus 4.6, Haiku 4.5, Gemini, GPT) can set it as normal.
#
# `max_tokens` is deliberately generous. These models think by default, and thinking tokens are billed
# against the same ceiling as the answer — a judge given 2048 spent 1931 of them thinking and had its
# verdict cut off mid-table. Size for the reasoning plus the answer, not the answer alone. (16k also
# keeps a non-streaming request under the SDK's HTTP timeout; going much higher needs streaming.)
llms:
  rag_llm:
    model: "gemini/gemini-3.1-flash-lite"
    api_key: GEMINI  # the env var holding the key, or paste the key here directly
    max_tokens: 16000
    type: "generator"

  generator_llm_1:  # the workhorse behind the specialists
    model: "gemini/gemini-3.1-flash-lite"
    api_key: GEMINI
    max_tokens: 16000
    type: "generator"

  generator_llm_2:  # for the short structured answers — still needs room to think first
    model: "gemini/gemini-3.1-flash-lite"
    api_key: GEMINI
    max_tokens: 8000
    type: "generator"

  generator_llm_thinker:  # every agent's fallback when its primary call fails
    model: "gemini/gemini-3.1-flash-lite"
    api_key: GEMINI
    max_tokens: 16000
    type: "generator"

  judger_agent_1:  # the review comes from a stronger model than the work it is reviewing
    model: "gemini/gemini-3.1-flash-lite"
    api_key: GEMINI
    max_tokens: 16000
    type: "judger"


dbs:
  # The two knowledge stores `problem_analyzer_agent` retrieves from once its `type` is switched to
  # "rag", and the ones `console.agentic.save_question` writes every incoming chat question into
  # regardless of that switch. Both paths are real, already-built stores — `feature_engineering/dbs/`,
  # the same directory `dataset.py`'s synthetic knowledge-base build and `web_search_cache.py`'s
  # `open_cache()` already use — not the `feature_store_agent/...` path this block pointed at before,
  # which names a directory nothing in this repo creates. `dimension` must match the width of the
  # embeddings model below.
  - name: "ds_knowledge_db"
    type: "vector"
    db: "faiss"
    path: "feature_engineering/dbs/faiss_index/index.faiss"
    dimension: 3072
    metric: "cosine"
  - name: "ds_knowledge_text_db"
    type: "vector"
    db: "chroma"  # was "chromadb", not a registered engine — see VECTOR_DBS in agent_builder
    path: "feature_engineering/dbs/chroma_db"


embeddings:
  rag_embeddings:
    model: "google/gemini-embedding-001"
    api_key: GEMINI


tools:
  # ---- data ---------------------------------------------------------------------------------------
  - name: "data_reader_tool"
    description: "Profile a dataset: row and column counts, column kinds, missing values, target balance, and sample rows."
    caller: "benchmarks.tools.data_reader_caller"
    args:
      - name: "data_source"
        type: "str"
        description: "Path to the CSV. Defaults to the churn training set."
        required: false
      - name: "limit"
        type: "int"
        description: "How many sample rows to return."
        required: false
      - name: "columns"
        type: "list"
        description: "Restrict the profile to these columns."
        required: false

  - name: "data_ingestion_tool"
    description: "Read a dataset in and apply preprocessing steps: strip_whitespace, drop_duplicates, drop_missing_target, coerce_numeric."
    caller: "benchmarks.tools.data_ingestion_caller"
    args:
      - name: "data_source"
        type: "str"
        description: "The source of the data to be ingested."
        required: false
      - name: "preprocessing_steps"
        type: "list"
        description: "Steps to apply while ingesting."
        required: false

  - name: "data_cleaning_tool"
    description: "Impute missing values, clip outliers and drop duplicate rows, reporting every change made."
    caller: "benchmarks.tools.data_cleaning_caller"
    args:
      - name: "data_source"
        type: "str"
        description: "Path to the CSV to clean."
        required: false
      - name: "missing_strategy"
        type: "str"
        description: "How to fill missing numeric values."
        enum: ["median", "mean", "drop"]
        required: false
      - name: "drop_duplicates"
        type: "bool"
        description: "Remove rows that repeat verbatim."
        required: false
      - name: "outlier_method"
        type: "str"
        description: "How to treat outliers: clip beyond 1.5x IQR, or leave them."
        enum: ["iqr", "none"]
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the cleaned dataset."
        required: false

  - name: "data_transformation_tool"
    description: "Transform columns with log, sqrt, zscore or bucket, adding the result as a new column."
    caller: "benchmarks.tools.data_transformation_caller"
    args:
      - name: "data_source"
        type: "str"
        description: "Path to the CSV to transform."
        required: false
      - name: "transformations"
        type: "list"
        description: "List of {column, operation} mappings."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the transformed dataset."
        required: false

  - name: "data_validation_tool"
    description: "Check a dataset is fit to train on — target present, binary and balanced enough, ids unique, missingness under a ceiling — returning one pass/fail per check."
    caller: "benchmarks.tools.data_validation_caller"
    args:
      - name: "data_source"
        type: "str"
        description: "Path to the CSV to validate."
        required: false
      - name: "target"
        type: "str"
        description: "The column being predicted."
        required: false
      - name: "expectations"
        type: "dict"
        description: "Overrides: min_rows, max_missing_rate, min_positive_rate."
        required: false

  # ---- features -----------------------------------------------------------------------------------
  - name: "feature_engineering_tool"
    description: "Derive domain features (charges_per_month, tickets_per_year, engagement_index, revenue_per_product, is_month_to_month, pays_by_echeck, tenure_bucket) and optionally transform them."
    caller: "benchmarks.tools.feature_engineering_caller"
    args:
      - name: "feature_list"
        type: "list"
        description: "Which derived features to build."
        required: false
      - name: "transformation_steps"
        type: "list"
        description: "Transformations to apply to what was derived."
        required: false
      - name: "data_source"
        type: "str"
        description: "Path to the CSV to build features from."
        required: false

  - name: "feature_generator_tool"
    description: "Search numeric column pairs for ratio features that correlate with the target better than their parents do, keeping the strongest."
    caller: "benchmarks.tools.feature_generator_caller"
    args:
      - name: "data_source"
        type: "str"
        description: "Path to the CSV to generate features from."
        required: false
      - name: "max_features"
        type: "int"
        description: "How many generated features to keep."
        required: false

  - name: "feature_extraction_tool"
    description: "Build composite features that summarise several columns at once: value_score, friction_score, commitment_score."
    caller: "benchmarks.tools.feature_extraction_caller"
    args:
      - name: "data_source"
        type: "str"
        description: "Path to the CSV to extract from."
        required: false
      - name: "aggregations"
        type: "list"
        description: "Which composites to build."
        required: false

  - name: "feature_encoding_tool"
    description: "Encode categorical columns as numbers, one-hot or ordinal."
    caller: "benchmarks.tools.feature_encoding_caller"
    args:
      - name: "data_source"
        type: "str"
        description: "Path to the CSV to encode."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to encode. Defaults to every categorical column."
        required: false
      - name: "method"
        type: "str"
        description: "Encoding to apply."
        enum: ["one_hot", "ordinal"]
        required: false

  - name: "feature_scaling_tool"
    description: "Scale numeric columns to zero mean and unit variance, or to a 0..1 range."
    caller: "benchmarks.tools.feature_scaling_caller"
    args:
      - name: "data_source"
        type: "str"
        description: "Path to the CSV to scale."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to scale. Defaults to every numeric column."
        required: false
      - name: "method"
        type: "str"
        description: "Scaling to apply."
        enum: ["standard", "minmax"]
        required: false

  - name: "feature_selection_tool"
    description: "Screen, rank against the target, flag leakage, prune redundancy, and write out the columns worth keeping."
    caller: "feature_engineering.tools.feature_selection.feature_selection_caller"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/JSON holding the features."
        required: false
      - name: "target"
        type: "str"
        description: "The column being predicted."
        required: false
      - name: "method"
        type: "str"
        description: "Ranking method; \"auto\" picks one that always works. Call feature_selection_methods_tool for the catalogue."
        required: false
      - name: "top_k"
        type: "int"
        description: "How many features to keep."
        required: false
      - name: "min_score"
        type: "float"
        description: "Keep only features scoring at least this."
        required: false
      - name: "features"
        type: "list"
        description: "Restrict the candidates to these columns."
        required: false
      - name: "exclude"
        type: "list"
        description: "Columns to leave out of the candidates entirely, e.g. ids and dates."
        required: false
      - name: "task"
        type: "str"
        description: "\"binary\", \"multiclass\" or \"regression\". Inferred from the target when omitted."
        required: false
      - name: "keep_columns"
        type: "list"
        description: "Columns to carry into the output even though they are not features — the ids, the date."
        required: false
      - name: "max_correlation"
        type: "float"
        description: "The association at which the weaker of two features is pruned."
        required: false
      - name: "leakage_score"
        type: "float"
        description: "The share of the target a feature may explain, 0..1, before it is treated as leakage."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the selected columns. Defaults to a file beside the input."
        required: false

  - name: "feature_screening_tool"
    description: "Check which columns can be features at all, with no target needed — missingness, constancy, duplication."
    caller: "feature_engineering.tools.feature_selection.feature_screening_caller"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/JSON, or the rows themselves."
        required: false
      - name: "features"
        type: "list"
        description: "Restrict the screen to these columns."
        required: false
      - name: "max_missing_rate"
        type: "float"
        description: "The share of missing values a column is allowed."
        required: false

  - name: "feature_selection_methods_tool"
    description: "The catalogue: every ranking method, what it measures, the tasks it supports, and whether it is installed."
    caller: "feature_engineering.tools.feature_selection.list_feature_selection_methods_caller"
    args:
      - name: "method"
        type: "str"
        description: "Restrict the listing to one method."
        required: false
      - name: "task"
        type: "str"
        description: "Restrict it to the methods that can score this kind of target."
        required: false

  # `feature_prep_tool`, `feature_prep_steps_tool`, `feature_generation_tool`, `missing_report_tool` and
  # `impute_missing_tool` are real, importable code in this package — `feature_engineering.tools.*` —
  # the same as the three `feature_selection_*` tools above. `feature_prep.md` and
  # `missing_value_imputations.md` (`prompts/`) already document each one in full; the entries below
  # just point `caller:` at the function backing it.
  - name: "feature_prep_steps_tool"
    description: "List every feature preparation step: what it does, whether it changes the grain, and the arguments it takes."
    caller: "feature_engineering.tools.feature_prep.list_feature_prep_steps_caller"
    args:
      - name: "step"
        type: "str"
        description: "Restrict the listing to one step."
        required: false

  - name: "feature_prep_tool"
    description: "Run named feature-prep steps over a dataset in order, resolving id/date/aggregation columns first, and report what each step added."
    caller: "feature_engineering.tools.feature_prep.feature_prep_caller"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/JSON to build features from, or the rows themselves."
        required: false
      - name: "id_columns"
        type: "list"
        description: "Entity columns to group by. Inferred from the column names when omitted."
        required: false
      - name: "date_columns"
        type: "list"
        description: "Timestamp columns. Inferred from the values when omitted."
        required: false
      - name: "aggregation_columns"
        type: "list"
        description: "Numeric columns to aggregate and transform. Inferred when omitted."
        required: false
      - name: "steps"
        type: "list"
        description: "Step names, run in this order. Call feature_prep_steps_tool for the catalogue. Defaults to the standard bundle."
        required: false
      - name: "options"
        type: "dict"
        description: "Per-step arguments, {step: {argument: value}}, or flat for every step."
        required: false
      - name: "reference_date"
        type: "str"
        description: "The 'now' that recency and window features are measured from."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the prepared dataset. Defaults to a file beside the input."
        required: false
      - name: "limit"
        type: "int"
        description: "How many sample rows to return."
        required: false

  - name: "feature_generation_tool"
    description: "Generate a whole bundle of generic features in one call, without naming individual steps — row-level, entity-level, or numeric-only."
    caller: "feature_engineering.tools.feature_prep.feature_generation_caller"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/JSON to build features from, or the rows themselves."
        required: false
      - name: "id_columns"
        type: "list"
        description: "Entity columns to group by. Inferred when omitted."
        required: false
      - name: "date_columns"
        type: "list"
        description: "Timestamp columns. Inferred when omitted."
        required: false
      - name: "aggregation_columns"
        type: "list"
        description: "Numeric columns to build from. Inferred when omitted."
        required: false
      - name: "level"
        type: "str"
        description: "'row' enriches every row in place; 'entity' collapses the log into one row per entity; 'numeric' works the measurements alone; 'all' runs row then numeric."
        enum: ["row", "entity", "numeric", "all"]
        required: false
      - name: "reference_date"
        type: "str"
        description: "The 'now' that recency and window features are measured from."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the generated dataset. Defaults to a file beside the input."
        required: false
      - name: "limit"
        type: "int"
        description: "How many sample rows to return."
        required: false

  - name: "missing_report_tool"
    description: "Report what a dataset is missing and what each column needs, without changing anything: rate per column, patterns, relatedness, and a recommended method with its reason."
    caller: "feature_engineering.tools.missing.missing_report_caller"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/JSON to inspect, or the rows themselves."
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to inspect. Defaults to every column."
        required: false
      - name: "id_columns"
        type: "list"
        description: "Entity columns. Inferred from the column names when omitted."
        required: false
      - name: "date_columns"
        type: "list"
        description: "Timestamp columns. Inferred from the values when omitted."
        required: false
      - name: "patterns"
        type: "int"
        description: "How many missing-together combinations to report."
        required: false

  - name: "impute_missing_tool"
    description: "Fill a dataset's missing values with one named method, writing a {column}_is_missing flag first, and report per column what was filled, with what, and how many holes remain."
    caller: "feature_engineering.tools.missing.impute_missing_caller"
    args:
      - name: "data"
        type: "str"
        description: "Path to the CSV/JSON to impute, or the rows themselves."
        required: false
      - name: "method"
        type: "str"
        description: "Call missing_report_tool first — it recommends one per column and says why."
        enum: ["auto", "statistic", "group", "forward", "interpolate", "knn", "regression", "random_sample", "category", "plan"]
        required: false
      - name: "columns"
        type: "list"
        description: "Columns to fill. Defaults to every column with a hole."
        required: false
      - name: "statistic"
        type: "str"
        description: "The value rule for the 'statistic' and 'group' methods: median, mean, mode, min, max, zero, or constant."
        required: false
      - name: "id_columns"
        type: "list"
        description: "Entity columns. Inferred when omitted."
        required: false
      - name: "date_columns"
        type: "list"
        description: "Timestamp columns. Inferred when omitted."
        required: false
      - name: "value"
        type: "str"
        description: "What to fill with, for statistic='constant'."
        required: false
      - name: "indicators"
        type: "bool"
        description: "Write a {column}_is_missing flag before filling. Leave this on unless something downstream cannot take the extra columns."
        required: false
      - name: "options"
        type: "dict"
        description: "Extra arguments for the chosen method: neighbours, max_donors, feature_columns, rounds, direction, limit, label, seed, values."
        required: false
      - name: "output_path"
        type: "str"
        description: "Where to write the imputed dataset. Defaults to a file beside the input."
        required: false
      - name: "limit"
        type: "int"
        description: "How many sample rows to return."
        required: false

  # ---- models -------------------------------------------------------------------------------------
  - name: "classification_tool"
    description: "Train the binary classifier — a class-weighted logistic regression — and save it for scoring. Returns training metrics and the strongest coefficients."
    caller: "benchmarks.tools.classification_caller"
    args:
      - name: "data_source"
        type: "str"
        description: "Path to the training CSV."
        required: false
      - name: "target"
        type: "str"
        description: "The column being predicted."
        required: false
      - name: "hyperparameters"
        type: "dict"
        description: "learning_rate, epochs, l2, class_weight, threshold."
        required: false
      - name: "model_path"
        type: "str"
        description: "Where to save the fitted model."
        required: false

  - name: "regression_tool"
    description: "Fit a linear regression on a continuous target, reporting RMSE, MAE and R-squared."
    caller: "benchmarks.tools.regression_caller"
    args:
      - name: "data_source"
        type: "str"
        description: "Path to the training CSV."
        required: false
      - name: "target"
        type: "str"
        description: "The continuous column to predict."
        required: false
      - name: "hyperparameters"
        type: "dict"
        description: "learning_rate, epochs, l2."
        required: false

  - name: "ranking_tool"
    description: "Rank customers by predicted churn risk and report precision, capture rate and lift over random targeting at a given depth."
    caller: "benchmarks.tools.ranking_caller"
    args:
      - name: "data_source"
        type: "str"
        description: "Path to the CSV to score and rank."
        required: false
      - name: "model_path"
        type: "str"
        description: "Path to the saved model to score with."
        required: false
      - name: "top_k"
        type: "int"
        description: "How deep the targeting list goes."
        required: false

  - name: "clustering_tool"
    description: "Segment customers with k-means and report the churn rate and distinguishing features of each segment."
    caller: "benchmarks.tools.clustering_caller"
    args:
      - name: "data_source"
        type: "str"
        description: "Path to the CSV to cluster."
        required: false
      - name: "n_clusters"
        type: "int"
        description: "How many segments to build."
        required: false
      - name: "iterations"
        type: "int"
        description: "Maximum k-means iterations."
        required: false

  - name: "dimensionality_reduction_tool"
    description: "Run PCA over the feature space and report the variance each component explains and the features loading onto it."
    caller: "benchmarks.tools.dimensionality_reduction_caller"
    args:
      - name: "data_source"
        type: "str"
        description: "Path to the CSV to reduce."
        required: false
      - name: "n_components"
        type: "int"
        description: "How many components to extract."
        required: false

  - name: "neural_network_tool"
    description: "Train a one-hidden-layer neural network on the same problem, as the non-linear comparison against the logistic regression."
    caller: "benchmarks.tools.neural_network_caller"
    args:
      - name: "data_source"
        type: "str"
        description: "Path to the training CSV."
        required: false
      - name: "target"
        type: "str"
        description: "The column being predicted."
        required: false
      - name: "hidden_units"
        type: "int"
        description: "Width of the hidden layer."
        required: false
      - name: "epochs"
        type: "int"
        description: "Training epochs."
        required: false
      - name: "learning_rate"
        type: "float"
        description: "SGD learning rate."
        required: false

  - name: "hyperparameter_tuning_tool"
    description: "Grid-search the classifier's hyperparameters by cross-validated ROC AUC, returning every combination's score, not only the winner."
    caller: "benchmarks.tools.hyperparameter_tuning_caller"
    args:
      - name: "data_source"
        type: "str"
        description: "Path to the training CSV."
        required: false
      - name: "target"
        type: "str"
        description: "The column being predicted."
        required: false
      - name: "grid"
        type: "dict"
        description: "Values to search: learning_rate, l2, epochs."
        required: false
      - name: "folds"
        type: "int"
        description: "Cross-validation folds per combination."
        required: false

  - name: "model_development_tool"
    description: "Develop a model of the requested kind, dispatching to the tool that trains it."
    caller: "benchmarks.tools.model_development_caller"
    args:
      - name: "model_type"
        type: "str"
        description: "The type of model to be developed."
        enum: ["classification", "regression", "neural_network", "clustering"]
        required: false
      - name: "hyperparameters"
        type: "dict"
        description: "Dictionary of hyperparameters for the model."
        required: false
      - name: "data_source"
        type: "str"
        description: "Path to the training CSV."
        required: false

  # ---- evaluation, operations, benchmarking -------------------------------------------------------
  - name: "model_evaluation_tool"
    description: "Score a saved model on held-out data and return the full metric set with its confusion matrix and the majority-class baseline."
    caller: "benchmarks.tools.model_evaluation_caller"
    args:
      - name: "model_path"
        type: "str"
        description: "Path to the saved model."
        required: false
      - name: "data_source"
        type: "str"
        description: "Path to the evaluation CSV. Defaults to the holdout set."
        required: false
      - name: "threshold"
        type: "float"
        description: "Decision threshold to score at."
        required: false

  - name: "performance_metrics_tool"
    description: "Sweep the decision threshold and report the metrics at each one, with the threshold that maximises F1."
    caller: "benchmarks.tools.performance_metrics_caller"
    args:
      - name: "model_path"
        type: "str"
        description: "Path to the saved model."
        required: false
      - name: "data_source"
        type: "str"
        description: "Path to the evaluation CSV."
        required: false
      - name: "metrics"
        type: "list"
        description: "Which metrics to report at each threshold."
        required: false

  - name: "cross_validation_tool"
    description: "Run stratified k-fold cross-validation and return the score per fold plus its spread — the number a single split can flatter."
    caller: "benchmarks.tools.cross_validation_caller"
    args:
      - name: "data_source"
        type: "str"
        description: "Path to the training CSV."
        required: false
      - name: "target"
        type: "str"
        description: "The column being predicted."
        required: false
      - name: "folds"
        type: "int"
        description: "Number of folds."
        required: false
      - name: "hyperparameters"
        type: "dict"
        description: "Hyperparameters to validate."
        required: false

  - name: "mlops_integration_tool"
    description: "Write the deployment manifest for a trained model: serving contract, monitoring plan and rollback criteria."
    caller: "benchmarks.tools.mlops_integration_caller"
    args:
      - name: "deployment_environment"
        type: "str"
        description: "The environment where the model will be deployed (e.g., cloud, on-premise)."
        required: false
      - name: "monitoring_metrics"
        type: "list"
        description: "List of metrics to monitor the model's performance in production."
        required: false
      - name: "model_path"
        type: "str"
        description: "Path to the model being deployed."
        required: false

  - name: "benchmarking_tool"
    description: "Compare the trained model against the baselines it has to beat: the majority class, and the single-rule heuristic a business already has."
    caller: "benchmarks.tools.benchmarking_caller"
    args:
      - name: "benchmark_dataset"
        type: "str"
        description: "The dataset against which the model will be benchmarked."
        required: false
      - name: "performance_metrics"
        type: "list"
        description: "List of performance metrics to compare on."
        required: false
      - name: "model_path"
        type: "str"
        description: "Path to the model being benchmarked."
        required: false


agents:
  # Every agent below is backed by a real prompt in `prompts/` — `problem_analyzer.md`, `feature_prep.md`,
  # `missing_value_imputations.md`, `feature_selection.md`. This block used to carry the "benchmarks"
  # example's agents wholesale (`data_engineer`, `feature_preprocessing`, `model_developer`, `evaluator`,
  # `mlops`, `benchmark`, `problem_classier_agent`, and five judgers), every one of them pointed at a
  # `benchmarks/prompts/*.md` file that names a directory this repo does not have — the same dangling
  # state `data_engineer`'s own config was cleaned up from. They are removed here rather than left
  # dangling; add a stage back once a real prompt exists for it. `problem_classier_agent`'s old job —
  # naming the problem type — is `problem_analyzer_agent`'s own step 4 now, not a separate stage.
  #
  # `{target}` (`problem_analyzer_agent`, `feature_selection_agent`) and `{human_feedback}`
  # (`problem_analyzer_agent`) are placeholders these two prompts declare that `BasePrompt` has no
  # wiring for yet: `_substitute` fills a `{name}` from another configured agent's output, or from a
  # matching attribute this instance sets — `question`, `context`, `agent_output`, a threshold name —
  # and nothing sets `target` or `human_feedback`. `AgentHandle.run()`'s `**kwargs` do not reach the
  # prompt either; they flow to the LLM call, not the template. Until `agent_builder` grows a way to
  # set them, fold the target column and any human answer into `{context}` when calling these two, or
  # that section renders unfilled.
  problem_analyzer_agent:  # starts the run — no dependency_agent
    type: "thinker"  # switch to "rag" to retrieve from ds_knowledge_db before answering
    db_vector: "ds_knowledge_db"
    text_vector: "ds_knowledge_text_db"
    llm: "rag_llm"
    substitute_llm: "generator_llm_thinker"
    prompt_path: "prompts/problem_analyzer.md"

  missing_value_agent:
    type: "generator"
    dependency_agent: "problem_analyzer_agent"
    llm: "generator_llm_1"
    substitute_llm: "generator_llm_thinker"
    prompt_path: "prompts/missing_value_imputations.md"
    tools:
      - "missing_report_tool"
      - "impute_missing_tool"
      - "feature_prep_steps_tool"
      - "feature_prep_tool"

  feature_prep_agent:
    type: "generator"
    dependency_agent:
      - "problem_analyzer_agent"
      - "missing_value_agent"
    llm: "generator_llm_1"
    substitute_llm: "generator_llm_thinker"
    prompt_path: "prompts/feature_prep.md"
    tools:
      - "feature_prep_steps_tool"
      - "feature_prep_tool"
      - "feature_generation_tool"

  # Deliberately split from `feature_prep_agent`, which builds features without ever reading the
  # target, so nothing that can leak the label lives in the same agent as the tools that build from
  # it. See `feature_selection.md`'s own header for why the split matters.
  feature_selection_agent:
    type: "generator"
    dependency_agent:
      - "problem_analyzer_agent"
      - "feature_prep_agent"
    llm: "generator_llm_1"
    substitute_llm: "generator_llm_thinker"
    prompt_path: "prompts/feature_selection.md"
    tools:
      - "feature_selection_methods_tool"
      - "feature_screening_tool"
      - "feature_selection_tool"


orchestrators:
  # The sub-agents in this stage run in this order — every output is available to the next by name.
  feature_prep_workflow:
    sub_agents:
      - "missing_value_agent"
      - "feature_prep_agent"


pipeline:
  - name: "feature_engineering_workflow"
    loops: 1
    description: "Frame the problem, then impute, build and select features over the churn dataset."
    steps:
      - name: "problem_statement"
        processor:
          type: "agent"
          name: "problem_analyzer_agent"
      - name: "feature_engineering"
        processor:
          type: "orchestrator"
          name: "feature_prep_workflow"
      - name: "feature_selection"
        processor:
          type: "agent"
          name: "feature_selection_agent"
